<text x="32" y="103.8" font-size="15" fill="#566070">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses for it.</text>
<text x="32" y="125.5" font-size="15" fill="#566070">Datasheet: 2 Pin configuration, Figure 2, p. 7.</text>
