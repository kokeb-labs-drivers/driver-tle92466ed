<title id="chip-pinout-title">TLE92466ED pinout, PG-DSO-36</title>
<desc id="chip-pinout-desc">Pinout of the TLE92466ED in PG-DSO-36, top view: 36 pins and an exposed pad, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
