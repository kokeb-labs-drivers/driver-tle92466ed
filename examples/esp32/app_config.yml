---
# TLE92466ED ESP32 examples: the app matrix read by the build scripts, the CI and the docs Examples page.
version: "1.0"

metadata:
  project: "ESP32 TLE92466ED Driver Examples"
  default_app: "tle92466ed_basic_example"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  tle92466ed_basic_example:
    description: "Start the TLE92466ED from menuconfig values, drive LOAD0 at 300 mA and log its feedback and faults"
    source_file: "tle92466ed_basic_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "ESP-IDF spi_master port (SPI mode 1) with every optional hook: RESN, EN, DRV0/1, FAULTN"
      - "Config from Kconfig (menuconfig) through tle92466ed_kconfig.hpp, CH0 in current control"
      - "Every Result checked and logged by name"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tle92466ed_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
