<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1068" viewBox="0 0 1200 1068" role="img" aria-labelledby="chip-frame-spi-title chip-frame-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi-title">TLE92466ED: SPI frame</title>
<desc id="chip-frame-spi-desc">SPI frame of the TLE92466ED, 32 bits, most significant bit first. Write: CRC (bits 31 to 24), address (bits 23 to 17), R/W (bit 16), data (bits 15 to 0); Read: CRC (bits 31 to 24), don't care (bits 23 to 17), R/W (bit 16), address (bits 15 to 0); Reply, 16 bit: CRC (bits 31 to 24), reply mode (bits 23 to 22), status (bits 21 to 17), R/W (bit 16), data (bits 15 to 0); Reply, 22 bit: CRC (bits 31 to 24), reply mode (bits 23 to 22), feedback data (bits 21 to 0); Critical fault: don't care (bits 31 to 24), reply mode (bits 23 to 22), don't care (bits 21 to 8), fault flags (bits 7 to 0). The fault flags field of the Critical fault row: bit 7 1V5 ok, bit 6 2V5 ok, bit 5 BG ok, bit 4 CLK_TOO_SLOW, bit 3 CLK_TOO_FAST, bit 2 DIG_CLK_TOO_SLOW, bit 1 DIG_CLK_TOO_FAST, bit 0 WD_REF_CLK. Below, the SPI mode 1 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="1067" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">TLE92466ED: SPI frame</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Every transfer is one 32-bit frame with CSN low; the reply comes one frame later and its CRC covers the low 24 bits. 32 bits,</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">sent most significant bit first. Datasheet: 5.2.3 SPI frame definition, p. 50.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
