<text x="32" y="858.3" font-size="16" fill="#9AA6B5">SPI mode 1: SCK idles low; the chip samples its input on the falling edge and changes its output after the rising edge. CSN stays low for the</text>
<text x="32" y="881.5" font-size="16" fill="#9AA6B5">whole frame.</text>
<text x="32" y="924.9" font-size="20" font-weight="700" fill="#E8EDF3">fault flags, one flag per bit (datasheet 5.2.3.5, p. 52)</text>
