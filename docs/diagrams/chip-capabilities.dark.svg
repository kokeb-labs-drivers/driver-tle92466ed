<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the TLE92466ED does</title>
<desc id="chip-capabilities-desc">Capability map of the TLE92466ED: Integrating current controller (supported): Holds each coil at a current setpoint from 0 to 1.5 A, with the PWM frequency regulated to a target; Dither (supported): Adds a triangular or trapezoidal ripple to the setpoint to keep a valve spool moving freely; Parallel channels (supported): Joins channels 0/3, 1/2 or 4/5 into one output for a larger load current; Direct drive (supported): Switches a channel without current control: a fixed on-time set over SPI, or following DRV0 or DRV1; Current feedback (supported): Reports each channel's average current, minimum and maximum, duty cycle and VBAT; Load diagnosis (supported): Detects open load, short to ground and overcurrent per channel, in the on and the off state; Supply and temperature monitoring (supported): Measures VBAT, VDD, VIO and the die temperature and flags under- and overvoltage and overtemperature; Operation states and watchdogs (supported): Config and Mission Mode, the SPI and clock watchdogs, CRC-checked frames and the built-in self-test; Monitor test modes (not covered): Test bits that fake a supply or overtemperature fault; two of them reset the chip, so they stay 0.</desc>
