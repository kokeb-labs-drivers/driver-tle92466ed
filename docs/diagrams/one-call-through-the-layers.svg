<title id="one-call-through-the-layers-title">One call through the layers</title>
<desc id="one-call-through-the-layers-desc">One SetCurrent call: the core range-checks and converts the target, the transport writes the set-point frame and checks the reply with an anchor read of the status register, and the core then updates its copy.</desc>
